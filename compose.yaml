name: pymes-agentes

services:
  n8n:
    image: docker.io/n8nio/n8n:2.44.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5680}:5678"
    environment:
      TZ: America/Lima
      GENERIC_TIMEZONE: America/Lima
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_EDITOR_BASE_URL: "http://localhost:${N8N_LOCAL_PORT:-5680}/"
      WEBHOOK_URL: "http://localhost:${N8N_LOCAL_PORT:-5680}/"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n

  pymes-sunat:
    build: ./sunat
    image: localhost/pymes-sunat:1
    restart: unless-stopped
    volumes:
      - sunat_data:/data

volumes:
  sunat_data:
  n8n_data:

